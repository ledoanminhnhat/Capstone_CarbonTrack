spring.application.name=carbontrack-backend

# Cổng chạy backend (frontend Next.js chạy 3000, backend chạy 8080)
server.port=${PORT:8080}

# Tên database dùng trong MongoDB Atlas
spring.data.mongodb.database=carbontrack

# Connection string được nạp từ file bí mật .env.properties (KHÔNG commit lên git).
# "optional:" nghĩa là nếu thiếu file thì app vẫn khởi động, chỉ là không có URI.
spring.config.import=optional:file:.env.properties

# JWT: khóa bí mật (base64) để ký token, và thời gian sống của token (24 giờ)
# Production: BẮT BUỘC set biến môi trường JWT_SECRET (giá trị mặc định chỉ dùng khi chạy local)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.jwt.secret=${JWT_SECRET:cw04E8wRlpPVAavwSqqtA1atRxNxPtHWz0Lm3yOlZKPfgifECAac1QDz+PVKAGzb}
app.jwt.expiration-ms=86400000

# CORS: domain frontend được phép gọi API (production: set CORS_ORIGINS, nhiều domain cách nhau bởi dấu phẩy)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Google login: OAuth Client ID (Web). Local: đặt trong .env.properties; production: biến GOOGLE_CLIENT_ID
google.client-id=${GOOGLE_CLIENT_ID:}

# Gửi mail (quên mật khẩu) qua Gmail SMTP. Local: username/password đặt trong .env.properties;
# production: biến MAIL_USERNAME / MAIL_PASSWORD (App Password của Gmail, không phải mật khẩu thật)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Link reset trong mail trỏ về frontend này
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
